<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar senha | Infinity School</title>
    <link rel="stylesheet" href="assets/css/recuperacao-senha.css" />
    <script src="../assets/js/api.js" defer></script>
    <script src="assets/js/recuperacao-senha.js" defer></script>
  </head>
  <body>
    <header class="cabecalho-recuperacao">
      <nav aria-label="Página de login">
        <a href="../Login/login.html" aria-label="Infinity School - voltar ao login">
          <img src="../Login/assets/img/Logo padrão 1.png" alt="Infinity School" />
        </a>
      </nav>
    </header>

    <main class="conteudo-recuperacao">
      <img src="assets/img/imagem da mulher.png" alt="" class="avatar-recuperacao" />
      <form class="formulario-recuperacao" id="formularioRecuperarSenha" data-etapa="recuperar" aria-labelledby="tituloRecuperacao" method="post">
        <h1 class="titulo-recuperacao" id="tituloRecuperacao">Redefinir Senha</h1>
        <p class="instrucao-recuperacao">Entre com seu email para redefinir:</p>
        <div class="campo campo-email-recuperacao">
          <label for="emailRecuperacao">Endereço de email</label>
          <input type="email" name="email" id="emailRecuperacao" autocomplete="email" required />
        </div>
        <button class="botao-enviar-recuperacao" type="submit">Enviar</button>
        <p class="mensagem-recuperacao" role="status" aria-live="polite" hidden></p>
      </form>
    </main>
  </body>
</html>
